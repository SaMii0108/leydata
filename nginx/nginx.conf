worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato JSON — compatible con Loki (app=leydata-nginx)
    log_format json_loki escape=json
        '{'
            '"time":"$time_iso8601",'
            '"app":"leydata-nginx",'
            '"level":"INFO",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_loki;

    sendfile           on;
    keepalive_timeout  65;

    # Límite de payload — protege contra uploads abusivos
    # Cambiar si algún endpoint necesita payloads más grandes (ej. PDF de política)
    client_max_body_size 1m;

    # Buffers conservadores para evitar buffering excesivo en memoria
    proxy_buffering        on;
    proxy_buffer_size      4k;
    proxy_buffers          8 4k;

    # Zonas de rate limiting (shared memory)
    # Zona "consent"  — captura y verificación de consentimientos
    limit_req_zone $binary_remote_addr zone=consent:10m rate=30r/m;
    # Zona "audit"    — consulta del ledger inmutable (endpoint sensible)
    limit_req_zone $binary_remote_addr zone=audit:10m   rate=10r/m;
    # Zona "api"      — endpoints admin/DPO (carga moderada esperada)
    limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;

    include /etc/nginx/conf.d/*.conf;
}
