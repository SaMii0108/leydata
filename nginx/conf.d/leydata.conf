# Upstream: backend Spring Boot en el HOST (no en Docker)
# host.docker.internal resuelve al host gracias a extra_hosts en docker-compose.yml
upstream backend {
    server host.docker.internal:8080;
    keepalive 16;
}

# Upstream: orquestador WebFlux en Docker
upstream orchestrator {
    server orchestrator:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # ── Headers de seguridad (todas las respuestas) ──────────────────────────
    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Ocultar headers de seguridad del upstream ───────────────────────────
    # Spring Security (backend y orquestador) inyecta sus propios headers.
    # proxy_hide_header los elimina de la respuesta antes de que add_header
    # agregue los de NGINX — evita duplicados y valores conflictivos.
    # (Spring Security 6+ pone X-XSS-Protection: 0; NGINX pondría 1;mode=block)
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;

    # ── Timeouts proxy ───────────────────────────────────────────────────────
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ── Headers comunes hacia upstream ───────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── /api/audit/** — ledger inmutable, rate limit estricto ────────────────
    # 10 req/min por IP, burst 5 sin delay
    # Si el CPDT hace una auditoría, 10 req/min es más que suficiente
    location /api/audit/ {
        limit_req zone=audit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
    }

    # ── /api/** — endpoints admin, DPO, propósitos, usuarios ─────────────────
    # 60 req/min por IP, burst 20
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
    }

    # ── /consent/** — orquestador (captura, revocación, verificación) ────────
    # 30 req/min por IP, burst 10
    location /consent/ {
        limit_req zone=consent burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://orchestrator;
    }

    # ── /actuator/health — sin rate limit, para monitoreo ───────────────────
    location /actuator/health {
        proxy_pass http://backend;
    }

    # ── Todo lo demás — cerrado ──────────────────────────────────────────────
    location / {
        return 404;
    }
}
