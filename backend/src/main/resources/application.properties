spring.application.name=backend

#  Base de datos 
spring.datasource.url=jdbc:postgresql://localhost:5433/leydata_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

#  Hibernate 
# create-drop: recrea el esquema en cada inicio (solo para desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#  Keycloak Resource Server 
# El backend valida los JWT emitidos por Keycloak descargando la clave pública
# desde el endpoint JWKS del realm. No se almacena ningún secreto aquí.
#
# IMPORTANTE: el realm "leydata" debe existir en Keycloak antes de iniciar el backend.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/leydata

#  Keycloak Admin — Service Account para gestión de usuarios desde el backend
#  El cliente "leydata-backend" se configura en Keycloak con service accounts habilitados.
#  El secret se obtiene de Keycloak Admin → Clients → leydata-backend → Credentials.
#  En producción usar variable de entorno: KC_BACKEND_SECRET
#  SpringDoc OpenAPI / Swagger UI
#  Documentación interactiva disponible en: http://localhost:8080/swagger-ui.html
#  Especificación JSON en:                  http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.api-docs.path=/v3/api-docs
#Excluir endpoints internos de Spring del spec
springdoc.paths-to-exclude=/error

keycloak.admin.server-url=http://localhost:8180
keycloak.admin.realm=leydata
keycloak.admin.client-id=leydata-backend
keycloak.admin.client-secret=${KC_BACKEND_SECRET:changeme}
