spring.application.name=backend

# ── Write DataSource — PgBouncer → Primary (puerto 5435) ──────────────────────
spring.datasource.write.jdbc-url=jdbc:postgresql://localhost:5435/${DB_NAME:leydata_db}
spring.datasource.write.username=${DB_USER:admin}
spring.datasource.write.password=${DB_PASS:admin}
spring.datasource.write.driver-class-name=org.postgresql.Driver
spring.datasource.write.pool-name=HikariWrite
spring.datasource.write.maximum-pool-size=10
spring.datasource.write.minimum-idle=2

# ── Read DataSource — Réplica directa (puerto 5434) ───────────────────────────
spring.datasource.read.jdbc-url=jdbc:postgresql://localhost:5434/${DB_NAME:leydata_db}
spring.datasource.read.username=${DB_USER:admin}
spring.datasource.read.password=${DB_PASS:admin}
spring.datasource.read.driver-class-name=org.postgresql.Driver
spring.datasource.read.pool-name=HikariRead
spring.datasource.read.maximum-pool-size=20
spring.datasource.read.minimum-idle=5

# ── Hibernate ──────────────────────────────────────────────────────────────────
# update: aplica cambios de esquema sin borrar datos existentes (solo desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Dialecto explícito: evita que Hibernate intente conectarse en startup para detectarlo.
# Con AbstractRoutingDataSource + LazyConnectionDataSourceProxy esa probe ocurre fuera
# de cualquier transacción y puede fallar si PgBouncer todavía no aceptó la primera conexión.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Keycloak Resource Server ───────────────────────────────────────────────────
# El backend valida los JWT descargando la clave pública desde el JWKS del realm.
# El realm "leydata" debe existir en Keycloak antes de iniciar el backend.
# Si Keycloak no está corriendo, el backend no arranca.
# jwk-set-uri en lugar de issuer-uri: valida la firma pero no el issuer.
# Necesario en dev porque el Orquestador obtiene tokens vía keycloak:8080 (red Docker)
# y el issuer en esos tokens es "http://keycloak:8080/realms/leydata", no "localhost:8180".
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/leydata/protocol/openid-connect/certs

# ── Keycloak Admin — Service Account ──────────────────────────────────────────
# El cliente "leydata-backend" en Keycloak permite al backend crear usuarios
# vía la API de administración (POST /api/users).
# KC_BACKEND_SECRET se obtiene ejecutando: bash scripts/setup-keycloak.sh
keycloak.admin.server-url=http://localhost:8180
keycloak.admin.realm=leydata
keycloak.admin.client-id=leydata-backend
keycloak.admin.client-secret=${KC_BACKEND_SECRET:changeme}

# ── Swagger UI / SpringDoc ─────────────────────────────────────────────────────
# Documentación interactiva: http://localhost:8080/swagger-ui.html
# Especificación OpenAPI:    http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-exclude=/error
# Pre-rellena el client_id en el diálogo OAuth2 de Swagger UI
springdoc.swagger-ui.oauth.client-id=leydata-frontend
springdoc.swagger-ui.oauth.scopes=openid

# ── Redis ──────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Email (SMTP) ───────────────────────────────────────────────────────────────
# El servicio de email está DESHABILITADO por defecto.
# Para habilitarlo, setear MAIL_ENABLED=true junto con las credenciales SMTP.
# Sin estas variables el backend arranca normalmente y omite el envío de emails.
#
# Ejemplo con Mailtrap (desarrollo):
#   MAIL_ENABLED=true MAIL_HOST=sandbox.smtp.mailtrap.io MAIL_PORT=2525 MAIL_USER=xxx MAIL_PASS=xxx
#
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

