server:
  port: 8081

spring:
  application:
    name: leydata-orchestrator

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # NO configurar spring.security.oauth2.resourceserver aquí —
  # el decoder se declara manualmente en SecurityConfig para apuntar al JWKS externo
  # y no al Keycloak interno.

  # OAuth2 Client — credenciales M2M del Orquestador en Keycloak (outbound)
  security:
    oauth2:
      client:
        registration:
          leydata-system:
            client-id: ${KC_ORCHESTRATOR_CLIENT_ID:leydata-orchestrator}
            client-secret: ${KC_ORCHESTRATOR_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          leydata-system:
            token-uri: ${KC_TOKEN_URI:http://localhost:8180/realms/leydata/protocol/openid-connect/token}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: backend-proxy
              uri: ${LEYDATA_BACKEND_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
              filters:
                - RewritePath=/api/(?<segment>.*), /api/${segment}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

leydata:
  backend-url: ${LEYDATA_BACKEND_URL:http://localhost:8080}
  consent:
    cache-ttl-seconds: 300
    cache-soft-ttl-seconds: 240
  # JWKS del sistema cliente externo — configurable por implementación
  external-jwks-uri: ${EXTERNAL_JWKS_URI:}
