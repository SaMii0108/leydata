[databases]
; Pool de escritura → primary
leydata_db = host=db port=5432 dbname=leydata_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = session
max_client_conn = 100
default_pool_size = 20

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Keep-alive
server_idle_timeout = 600
client_idle_timeout = 0
